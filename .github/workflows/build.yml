name: Build NanaPlay APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch/tag/commit dari FahriAdison/NanaPlay (default: nanaplay)'
        required: false
        default: 'nanaplay'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NanaPlay source
        uses: actions/checkout@v4
        with:
          repository: FahriAdison/NanaPlay
          ref: ${{ inputs.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Patch signing config for CI
        working-directory: android
        run: |
          # Replace hardcoded keystore with env-var-driven config
          python3 - << 'EOF'
          import re
          p = 'app/build.gradle.kts'
          s = open(p).read()
          old = '''            storeFile = file("/home/hatch/workspace/opennow/keystore/nanaplay.keystore")
                      storePassword = "nanaplay2026"
                      keyAlias = "nanaplay"
                      keyPassword = "nanaplay2026"'''
          new = '''            storeFile = file(System.getenv("NANAPLAY_KEYSTORE_PATH") ?: "/tmp/nanaplay.keystore")
                      storePassword = System.getenv("NANAPLAY_KEYSTORE_PASSWORD") ?: ""
                      keyAlias = System.getenv("NANAPLAY_KEY_ALIAS") ?: "nanaplay"
                      keyPassword = System.getenv("NANAPLAY_KEY_PASSWORD") ?: ""'''
          if old in s:
              s = s.replace(old, new)
              open(p, 'w').write(s)
              print("patched signing config")
          else:
              print("WARNING: signing config pattern not found!")
          EOF

      - name: Restore keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/nanaplay.keystore 2>/dev/null
          echo "NANAPLAY_KEYSTORE_PATH=/tmp/nanaplay.keystore" >> $GITHUB_ENV
          # Diagnostic (no secret values printed)
          echo "KEYSTORE_BASE64 set: $([ -n "${{ secrets.KEYSTORE_BASE64 }}" ] && echo "yes (${#KEYSTORE_BASE64} chars)" || echo "NO")"
          echo "KEYSTORE_PASSWORD set: $([ -n "${{ secrets.KEYSTORE_PASSWORD }}" ] && echo yes || echo "NO")"
          echo "KEY_ALIAS set: $([ -n "${{ secrets.KEY_ALIAS }}" ] && echo yes || echo "NO")"
          echo "KEY_PASSWORD set: $([ -n "${{ secrets.KEY_PASSWORD }}" ] && echo yes || echo "NO")"
          if [ ! -s /tmp/nanaplay.keystore ]; then
            echo "❌ Keystore file empty or invalid base64!"
            exit 1
          fi
          echo "✅ Keystore file OK ($(wc -c < /tmp/nanaplay.keystore) bytes)"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build release APK
        working-directory: android
        env:
          NANAPLAY_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          NANAPLAY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          NANAPLAY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NanaPlay-APK
          path: android/app/build/outputs/apk/release/app-release.apk
