name: Build NanaPlay APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch/tag/commit dari FahriAdison/NanaPlay (default: nanaplay)'
        required: false
        default: 'nanaplay'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NanaPlay source
        uses: actions/checkout@v4
        with:
          repository: FahriAdison/NanaPlay
          ref: ${{ inputs.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Restore keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/nanaplay.keystore
          echo "NANAPLAY_KEYSTORE_PATH=/tmp/nanaplay.keystore" >> $GITHUB_ENV

      - name: Build release APK
        working-directory: android
        env:
          NANAPLAY_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          NANAPLAY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          NANAPLAY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NanaPlay-APK
          path: android/app/build/outputs/apk/release/app-release.apk
